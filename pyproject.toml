[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostledger"
version = "0.1.0"
description = "Local token and cost ledger for GhostSlice: ingests Slice estimates, Proxy and Bench reports, reports per project/model/agent/day with estimate-vs-actual and 3x loop warnings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "context", "ghostslice", "cost", "tokens", "agents", "ledger"]
dependencies = []

[project.scripts]
ghostledger = "ghostledger.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghostledger = ["prices.json"]
